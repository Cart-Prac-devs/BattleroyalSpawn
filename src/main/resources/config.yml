  announce: "&eA Battle Royale is forming! &7({queued}/{min} queued) "
  announce-click: "&a&l[CLICK TO JOIN]"
  announce-hover: "&7Click to join the queue"
  announce-leave-click: "&c[click to leave]"
  queue-joined: "&aYou joined the queue. &7({queued}/{min} needed)"
  queue-joined-match-running: "&aYou joined the queue for the &enext&a match. &7({queued} waiting)"
  queue-left: "&cYou left the queue."
  queue-already: "&cYou are already in the queue."
  queue-in-match: "&cYou are already in a match."
  not-in-queue: "&cYou are not in the queue or in a match."
  countdown-start: "&aEnough players! The cart leaves in &e{seconds}s&a."

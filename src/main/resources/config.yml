  countdown-shortened: "&eThe cart is full! Leaving in &6{seconds}s&e."
  countdown-tick: "&eLeaving in &6{seconds}s"
  countdown-title: "&e{seconds}"
  countdown-subtitle: "&7Get ready"
  world-missing: "&cThe arena world &e{world}&c is not loaded. Tell an admin."

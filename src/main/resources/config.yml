  doors-open: "&aDoors are open! Sneak to jump."
  doors-closed-actionbar: "&cDoors open in &e{seconds}s"
  aboard-actionbar: "&eHold &6SHIFT&e to drop  &8-  &f{aboard} &7still on the cart"
  drop-actionbar: "&bAltitude &f{altitude}m  &8-  &bDistance &f{distance}m"
  jump-title: "&c&lDROP!"
  jump-subtitle: "&7Glide to your landing spot"
  landed-title: "&a&lLANDED"
  landed-subtitle: "&7{grace}s of protection"

  live: "&aEveryone has landed. Fight!"
  left-match: "&cYou left the match."
  void-rescue: "&cYou fell out of the world and were lifted back up. Glide somewhere solid!"
  safety-landed: "&eYou took too long to land and were put on the ground."
  stopped: "&cThe match was stopped."
  returned: "&7You were returned to where the cart picked you up."
